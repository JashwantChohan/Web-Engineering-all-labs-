<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07 - Button Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="mb-3">Button Groups</h2>

        <h5>Different Colours</h5>
        <div class="btn-group mb-4" role="group">
            <button type="button" class="btn btn-primary">Primary</button>
            <button type="button" class="btn btn-secondary">Secondary</button>
            <button type="button" class="btn btn-success">Success</button>
            <button type="button" class="btn btn-danger">Danger</button>
            <button type="button" class="btn btn-warning">Warning</button>
            <button type="button" class="btn btn-info">Info</button>
        </div>

        <h5>Large Size</h5>
        <div class="btn-group btn-group-lg mb-4" role="group">
            <button type="button" class="btn btn-dark">Left</button>
            <button type="button" class="btn btn-dark">Middle</button>
            <button type="button" class="btn btn-dark">Right</button>
        </div>

        <h5>Small Size</h5>
        <div class="btn-group btn-group-sm mb-4" role="group">
            <button type="button" class="btn btn-info">Left</button>
            <button type="button" class="btn btn-info">Middle</button>
            <button type="button" class="btn btn-info">Right</button>
        </div>

        <h5>Outline Style</h5>
        <div class="btn-group mb-4" role="group">
            <button type="button" class="btn btn-outline-primary">Home</button>
            <button type="button" class="btn btn-outline-success">About</button>
            <button type="button" class="btn btn-outline-danger">Contact</button>
        </div>
    </div>

</body>
</html>
