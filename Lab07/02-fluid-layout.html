<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07 - Fluid Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid mt-4">
        <h2 class="mb-3">Responsive Layout</h2>

        <div class="row mb-3">
            <div class="col-md-8 border bg-light p-3">
                <h5>Main Content</h5>
                <p>This column is wider. It takes 8 out of 12 parts on medium and large screens.</p>
            </div>
            <div class="col-md-4 border bg-light p-3">
                <h5>Sidebar</h5>
                <p>This column is smaller. It takes 4 out of 12 parts.</p>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12 border bg-info p-3 text-center">
                <h5>Full Width Row</h5>
                <p>This column takes the full width on every screen size.</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 border p-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg/330px-Tour_Eiffel_Wikimedia_Commons.jpg" class="img-fluid" alt="Eiffel Tower">
                <p class="mt-2">Eiffel Tower</p>
            </div>
            <div class="col-md-4 border p-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Taj_Mahal%2C_Agra%2C_India_edit3.jpg/330px-Taj_Mahal%2C_Agra%2C_India_edit3.jpg" class="img-fluid" alt="Taj Mahal">
                <p class="mt-2">Taj Mahal</p>
            </div>
            <div class="col-md-4 border p-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/The_Great_Wall_of_China_at_Jinshanling-edit.jpg/330px-The_Great_Wall_of_China_at_Jinshanling-edit.jpg" class="img-fluid" alt="Great Wall of China">
                <p class="mt-2">Great Wall of China</p>
            </div>
        </div>
    </div>

</body>
</html>
