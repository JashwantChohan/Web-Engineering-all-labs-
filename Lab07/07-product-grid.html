<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07 - Product Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="mb-3">Our Products</h2>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <img src="https://placehold.co/400x300?text=Laptop" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <img src="https://placehold.co/400x300?text=Mobile+Phone" class="card-img-top" alt="Mobile Phone">
                    <div class="card-body">
                        <h5 class="card-title">Mobile Phone</h5>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <img src="https://placehold.co/400x300?text=Headphones" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
