<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07 - Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="mb-3">Card Component</h2>

        <div class="card" style="width: 20rem;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Taj_Mahal%2C_Agra%2C_India_edit3.jpg/330px-Taj_Mahal%2C_Agra%2C_India_edit3.jpg" class="card-img-top" alt="Taj Mahal">
            <div class="card-body">
                <h5 class="card-title">Taj Mahal</h5>
                <p class="card-text">The Taj Mahal is a white marble tomb in Agra, India. It was built by Shah Jahan
                   in memory of his wife Mumtaz Mahal.</p>
                <a href="https://en.wikipedia.org/wiki/Taj_Mahal" class="btn btn-primary">Read More</a>
            </div>
        </div>
    </div>

</body>
</html>
