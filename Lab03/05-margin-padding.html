<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Margin and Padding</title>
    <style>
        .box1 {
            border: 2px solid blue;
            margin: 20px;
            padding: 10px;
        }
        .box2 {
            border: 2px solid green;
            margin: 40px 10px;
            padding: 25px;
        }
    </style>
</head>
<body>
    <h1>Margin and Padding Example</h1>
    <div class="box1">
        <h2>First Box</h2>
        <p>This box has 20px margin and 10px padding.</p>
    </div>
    <div class="box2">
        <h2>Second Box</h2>
        <p>This box has different margin and padding values.</p>
    </div>
</body>
</html>
