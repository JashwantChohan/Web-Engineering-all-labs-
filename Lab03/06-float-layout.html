<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Float Layout</title>
    <style>
        .menu {
            float: left;
            width: 30%;
            background-color: lightblue;
            padding: 10px;
            box-sizing: border-box;
        }
        .content {
            float: right;
            width: 65%;
            background-color: lightyellow;
            padding: 10px;
            box-sizing: border-box;
        }
        .clear {
            clear: both;
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <div class="menu">
        <h2>Menu</h2>
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </div>
    <div class="content">
        <h2>Content</h2>
        <p>This is the main content area of the website.</p>
    </div>
    <div class="clear"></div>
</body>
</html>
